name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-versions: ["1.25"]
        store:
          - name: redis
            image: redis:7-alpine
          - name: valkey
            image: valkey/valkey:8-alpine

    services:
      store:
        image: ${{ matrix.store.image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-versions }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...
        env:
          REDIS_ADDR: localhost:6379

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.go-version == '1.23' && matrix.store.name == 'redis'
        with:
          files: coverage.out
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: source
