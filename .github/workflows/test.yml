name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        store:
          - name: redis-6
            image: redis:6.2-alpine
          - name: redis-7
            image: redis:7-alpine
          - name: redis-8
            image: redis:8-alpine
          - name: valkey-7
            image: valkey/valkey:7-alpine
          - name: valkey-8
            image: valkey/valkey:8-alpine

    name: go.mod / ${{ matrix.store.name }}

    services:
      store:
        image: ${{ matrix.store.image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download
        env:
          GOTOOLCHAIN: local

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...
        env:
          GOTOOLCHAIN: local
          REDIS_ADDR: localhost:6379

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.9.0 run
        env:
          GOTOOLCHAIN: local
